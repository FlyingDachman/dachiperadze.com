<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Post | Dachi Peradze — FIFA &amp; CAS Sports Lawyer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500;1,600&family=Syne:wght@400;500;600;700;800&family=JetBrains+Mono:wght@300;400&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --void: #05050D; --deep: #09091A; --dark: #0D0D22; --surface: #11112A;
  --gold: #BF9A42; --gold-hi: #D4B265; --gold-lo: #7A6028;
  --gold-line: rgba(191,154,66,0.16); --ivory: #EDE8DC; --stone: #A09B90; --slate: #5C5750;
  --display: 'Cormorant Garamond', Georgia, serif;
  --ui: 'Syne', system-ui, sans-serif;
  --mono: 'JetBrains Mono', monospace;
  --nav-h: 66px; --max: 760px; --pad: 3rem;
}
html { scroll-behavior: smooth; font-size: 16px; }
body {
  font-family: var(--ui);
  background: var(--void);
  color: var(--ivory);
  line-height: 1.7;
  -webkit-font-smoothing: antialiased;
}
a { color: inherit; text-decoration: none; }
.container { max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); }

/* Nav */
nav {
  position: fixed; top: 0; left: 0; right: 0; height: var(--nav-h); z-index: 500;
  background: rgba(5,5,13,0.92); backdrop-filter: blur(20px);
  border-bottom: 1px solid var(--gold-line);
}
.nav-in {
  max-width: var(--max); margin: 0 auto; padding: 0 var(--pad); height: 100%;
  display: flex; align-items: center; justify-content: space-between;
}
.nav-logo { font-family: var(--ui); font-size: 0.7rem; font-weight: 800; letter-spacing: 0.26em; text-transform: uppercase; color: var(--ivory); }
.nav-logo em { color: var(--gold); }
.back-link {
  font-size: 0.7rem; font-weight: 600; letter-spacing: 0.15em; text-transform: uppercase;
  color: var(--stone); display: flex; align-items: center; gap: 0.4rem;
}
.back-link:hover { color: var(--gold); }

/* Content */
.post-header {
  padding: calc(var(--nav-h) + 3rem) 0 2rem;
  border-bottom: 1px solid var(--gold-line);
}
.post-date {
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--gold-lo);
  letter-spacing: 0.1em;
}
.post-title {
  font-family: var(--display);
  font-size: clamp(1.8rem, 5vw, 2.8rem);
  font-weight: 500;
  line-height: 1.15;
  margin: 0.6rem 0 1.2rem;
}
.post-body {
  font-size: 1.02rem;
  color: var(--stone);
  max-width: 72ch;
  padding: 2.5rem 0 3rem;
}
.post-body p { margin-bottom: 1.1rem; }

.cta-bar {
  margin-top: 2rem;
  padding-top: 2rem;
  border-top: 1px solid var(--gold-line);
  display: flex;
  gap: 1rem;
  flex-wrap: wrap;
}
.btn {
  display: inline-flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.72rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  padding: 0.85rem 1.6rem;
  border-radius: 3px;
  text-decoration: none;
  transition: all 0.2s;
}
.btn-gold {
  background: var(--gold);
  color: var(--void);
}
.btn-gold:hover { background: var(--gold-hi); }
.btn-ghost {
  border: 1px solid var(--gold-line);
  color: var(--stone);
}
.btn-ghost:hover {
  border-color: var(--gold);
  color: var(--gold);
}

.not-found {
  padding: 6rem 0;
  text-align: center;
  color: var(--stone);
}
.not-found h1 { font-family: var(--display); color: var(--ivory); margin-bottom: 1rem; }

footer {
  border-top: 1px solid var(--gold-line);
  padding: 2rem var(--pad);
  font-size: 0.72rem;
  color: var(--slate);
}
</style>
</head>
<body>

<nav>
  <div class="nav-in">
    <a class="nav-logo" href="../index.html">DACHI<em>·</em>PERADZE</a>
    <a href="index.html" class="back-link">
      ← All Insights
    </a>
  </div>
</nav>

<main class="container" id="main">
  <!-- Content injected by JS -->
  <div style="padding: 4rem 0; color: var(--slate);">Loading post…</div>
</main>

<footer class="container">
  <div>© 2026 Dachi Peradze · <a href="../index.html">dachiperadze.com</a></div>
</footer>

<script>
(async function loadPost() {
  const main = document.getElementById('main');
  const params = new URLSearchParams(window.location.search);
  const slug = params.get('slug');

  if (!slug) {
    showNotFound(main, 'No post specified.');
    return;
  }

  try {
    const res = await fetch('posts.json');
    const posts = await res.json();
    const post = posts.find(p => p.slug === slug);

    if (!post) {
      showNotFound(main, `Post with slug “${slug}” not found.`);
      return;
    }

    // Update page title
    document.title = `${post.title} | Dachi Peradze`;

    main.innerHTML = `
      <div class="post-header">
        <div class="post-date">${post.date}</div>
        <h1 class="post-title">${post.title}</h1>
      </div>

      <div class="post-body">
        <p>${post.excerpt}</p>
        ${post.content ? `<p>${post.content}</p>` : ''}
      </div>

      <div class="cta-bar">
        <a href="${post.linkedin}" target="_blank" rel="noopener" class="btn btn-gold">
          Read full post on LinkedIn →
        </a>
        <a href="index.html" class="btn btn-ghost">
          ← Back to all insights
        </a>
      </div>
    `;
  } catch (e) {
    showNotFound(main, 'Could not load posts. Please try again later.');
  }
})();

function showNotFound(container, message) {
  container.innerHTML = `
    <div class="not-found">
      <h1>Post not found</h1>
      <p style="margin-bottom: 2rem;">${message}</p>
      <a href="index.html" class="btn btn-ghost">← Back to Insights</a>
    </div>
  `;
}
</script>
</body>
</html>
